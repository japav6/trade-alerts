name: Trade alerts

on:
  schedule:
    # Every 10 minutes. GitHub may run it a few minutes late when busy.
    # Private repo? Use '*/30 * * * *' to stay inside the free 2,000 minutes/month.
    - cron: '*/10 * * * *'
  workflow_dispatch: # adds a "Run workflow" button for manual runs

permissions:
  contents: write # needed to save state/state.json back to the repo

concurrency:
  group: trade-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check for new trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node src/index.mjs

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m "Update tracker state"
          git pull --rebase
          git push
